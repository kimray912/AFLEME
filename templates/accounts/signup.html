{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-left">
        <div class="brand">AFLEME</div>
        <div class="sub">안양외고 학생 전용 리셀 플랫폼</div>
    </div>
    <div class="auth-right">
        <h2>회원가입</h2>
        <p class="desc">AFLEME에서 다양한 상품을 거래해보세요.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="auth-error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="auth-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                <input type="text" name="name" placeholder="이름" required>
            </div>
            <div class="auth-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
                <input type="text" name="student_id" placeholder="학번" required>
            </div>
            <div class="auth-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" name="username" placeholder="아이디" required>
            </div>
            <div class="auth-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 4l8 8 8-8"/></svg>
                <input type="email" name="email" placeholder="이메일" required>
            </div>
            <div class="auth-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" name="password" placeholder="비밀번호" required>
            </div>
            <div class="auth-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" name="password_confirm" placeholder="비밀번호 확인" required>
            </div>
            <button type="submit" class="auth-submit">회원가입</button>
        </form>

        <p class="auth-bottom">이미 계정이 있으신가요? <a href="{% url 'login' %}">로그인</a></p>
    </div>
</div>
{% endblock %}
