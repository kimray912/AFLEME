{% extends 'base.html' %}
{% block content %}
<main style="background:#fff; border-radius:12px; padding:32px; max-width:800px;">
    <h2 style="margin-bottom:20px;">알림</h2>

<div style="display:flex; gap:24px; border-bottom:1px solid #eee; padding-bottom:12px; margin-bottom:20px; font-size:14px;">
    <a href="{% url 'notification_list' %}" style="text-decoration:none; {% if filter_type == 'all' %}color:#101B3D; font-weight:700; border-bottom:2px solid #101B3D; padding-bottom:12px; margin-bottom:-13px;{% else %}color:#888;{% endif %}">전체</a>
    <a href="{% url 'notification_list' %}?type=trade" style="text-decoration:none; {% if filter_type == 'trade' %}color:#101B3D; font-weight:700; border-bottom:2px solid #101B3D; padding-bottom:12px; margin-bottom:-13px;{% else %}color:#888;{% endif %}">거래</a>
    <a href="{% url 'notification_list' %}?type=stock" style="text-decoration:none; {% if filter_type == 'stock' %}color:#101B3D; font-weight:700; border-bottom:2px solid #101B3D; padding-bottom:12px; margin-bottom:-13px;{% else %}color:#888;{% endif %}">입고</a>
</div>

    {% for n in notifications %}
    <div style="display:flex; gap:12px; padding:16px 0; border-bottom:1px solid #f5f5f5;">
        {% if n.notification_type == 'trade' %}
            <div style="width:32px; height:32px; border-radius:50%; background:#3E8E4F; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;">✓</div>
            <div>
                <div style="font-weight:700; font-size:14px;">거래 성사!</div>
                <div style="font-size:13px; color:#666; margin-top:2px;">{{ n.message }}</div>
            </div>
        {% else %}
            <div style="width:32px; height:32px; border-radius:50%; background:#2F5FDB; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;">🔔</div>
            <div>
                <div style="font-weight:700; font-size:14px;">입고 알림</div>
                <div style="font-size:13px; color:#666; margin-top:2px;">{{ n.message }}</div>
            </div>
        {% endif %}
    </div>
    {% empty %}
    <p style="color:#999; padding:20px 0;">아직 알림이 없습니다.</p>
    {% endfor %}
</main>
{% endblock %}
